# =============================================================
# Overlay de configuración de Cowrie (SOC Honeypots)
# =============================================================
# Este archivo es un OVERLAY: Cowrie 3.0.x lo mergea sobre los
# defaults empaquetados (cowrie.cfg.dist) — último archivo gana por
# clave. NO es necesario replicar el cfg completo.
#
# Resolución de rutas: el cwd del contenedor es /cowrie/cowrie-git,
# por lo que una ruta relativa aquí resuelve contra ese directorio.
#   - log/cowrie.json -> /cowrie/cowrie-git/log/cowrie.json
#                         = bind-mount host cowrie/logs/cowrie.json
#
# Los puertos coinciden con el mapeo de docker-compose.yml
# (host ${COWRIE_SSH_PORT}:2222 / host ${COWRIE_TELNET_PORT}:2223).

[ssh]
# Puerto de escucha SSH del honeypot (default del stack: 2222)
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# Honeypot SSH+Telnet: se habilita telnet en 2223 (el compose ya expone el puerto)
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
# Jsonlog de eventos: cada evento se escribe como línea JSON.
# 'logfile' es RELATIVO al cwd -> cae en el bind-mount cowrie/logs/
# y queda legible por el sidecar (soc-sidecar).
enabled = true
logfile = log/cowrie.json